name: Atril

options:
  bundleIdPrefix: com.alejandroriscart
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  developmentLanguage: es
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Pon aquí tu Team ID (Xcode > Settings > Accounts) o elígelo en Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_PREVIEWS: YES

targets:
  Atril:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Atril
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alejandroriscart.atril
        PRODUCT_NAME: Atril
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # macOS: sandbox con red saliente y lectura de archivos elegidos por el usuario.
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        # La IA de Apple solo existe en iPadOS/macOS 26+; en versiones anteriores la app usa el modo básico.
        OTHER_LDFLAGS: ["-weak_framework", "FoundationModels"]
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Atril
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.role-playing-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    # Se combina con las claves generadas: aquí solo lo que no se puede expresar con INFOPLIST_KEY.
    info:
      path: Atril/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # El .atril se lee en su sitio con acceso temporal (`openArchive`); no hace falta copiarlo.
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.alejandroriscart.atril.adventure
            UTTypeDescription: Aventura de Atril
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [atril]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Aventura de Atril
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.alejandroriscart.atril.adventure]

  AtrilTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/AtrilTests
    dependencies:
      - target: Atril
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alejandroriscart.atril.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen no distingue la ruta del ejecutable en macOS en targets multiplataforma.
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/Atril.app/Contents/MacOS/Atril"
        TEST_HOST[sdk=iphone*]: "$(BUILT_PRODUCTS_DIR)/Atril.app/Atril"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "2"

schemes:
  Atril:
    build:
      targets:
        Atril: all
    test:
      config: Debug
      targets:
        - AtrilTests
    run:
      config: Debug
    archive:
      config: Release
